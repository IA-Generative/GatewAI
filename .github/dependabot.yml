# Dependabot keeps Go modules, Actions and base images current.
# PRs target develop (gitflow); minor/patch updates are grouped to cut noise,
# majors come as individual PRs. Security updates are always raised.
version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    commit-message:
      prefix: "chore(deps)"
    groups:
      gateway-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: gomod
    directory: /relay
    target-branch: develop
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    commit-message:
      prefix: "chore(deps)"
    groups:
      relay-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(ci)"
    groups:
      actions:
        update-types: [minor, patch]

  - package-ecosystem: docker
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(docker)"

  - package-ecosystem: docker
    directory: /relay
    target-branch: develop
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(docker)"
